<style>

@font-face {
    font-family: 'Amiri';
    src: url('https://cdn.jsdelivr.net/gh/alif-type/amiri-font/Amiri-Bold.ttf')
    format('truetype');
    font-weight: bold;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    background: #e5f1fb;
    font-family: 'Amiri', Tahoma, Arial, sans-serif;
    font-weight: bold;
    color: #111;
}

/* ==============================
   ورقة A4
============================== */

.form-container {
    width: 210mm;
    height: 297mm;
    margin: 10px auto;
    background: #fff;

    padding: 9mm 10mm;

    box-shadow: 0 0 15px rgba(0,0,0,0.15);

    overflow: hidden;
}

/* ==============================
   الترويسة
============================== */

.header {
    position: relative;

    height: 115px;

    background: #f3f7fb;

    border: 2px solid #222;
    border-radius: 6px;

    padding: 10px 12px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.info {
    width: 72%;

    text-align: right;

    font-size: 17px;

    line-height: 1.5;
}

.info p {
    margin: 0;
}

/* الشعار */

.logo {
    position: absolute;

    left: 50%;
    top: 7px;

    transform: translateX(-50%);

    z-index: 5;
}

.logo img {
    width: 74px;
    height: 74px;

    object-fit: contain;
}

/* ==============================
   الصورة
============================== */

.photo-area {
    width: 82px;

    text-align: center;
}

.photo-box {
    width: 68px;
    height: 86px;

    margin: auto;

    border: 2px dashed #333;

    background: white;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    cursor: pointer;
}

.photo-box img {
    width: 100%;
    height: 100%;

    object-fit: cover;
}

.photo-text {
    font-size: 13px;
    color: #555;
}

.photo-label {
    display: block;

    margin-top: 3px;

    font-size: 10px;

    color: #444;
}

#photoInput {
    display: none;
}

/* ==============================
   العنوان
============================== */

h2 {
    text-align: center;

    margin: 8px 0 8px;

    font-size: 22px;

    border-bottom: 2px solid #222;

    padding-bottom: 4px;
}

/* ==============================
   الأقسام
============================== */

.section-title {
    margin-top: 6px;
    margin-bottom: 5px;

    padding: 4px 9px;

    background: #e8f1f8;

    border-right: 5px solid #222;

    font-size: 15.5px;

    line-height: 1.4;
}

/* ==============================
   الصفوف
============================== */

.row {
    display: flex;

    gap: 9px;

    margin-bottom: 6px;

    width: 100%;
}

.field {
    flex: 1;

    min-width: 0;
}

.field.large {
    flex: 1.5;
}

.field.small {
    flex: 0.7;
}

/* ==============================
   الحقول
============================== */

label {
    display: block;

    margin: 2px 0 3px;

    font-size: 13px;

    line-height: 1.3;
}

input,
textarea {
    width: 100%;

    border: 1px solid #555;

    border-radius: 4px;

    padding: 5px 8px;

    font-family: inherit;

    font-weight: bold;

    font-size: 14px;

    direction: rtl;

    text-align: right;

    background: #fff;
}

input {
    height: 33px;
}

textarea {
    height: 48px;

    resize: none;
}

.invalid {
    border: 2px solid #dc3545 !important;

    background: #fff4f4 !important;
}

/* ==============================
   عنوان السكن
============================== */

.address-row {
    margin-bottom: 6px;
}

/* ==============================
   QR
============================== */

.qr-section {
    display: flex;

    align-items: center;

    justify-content: space-between;

    border-top: 1px solid #777;

    margin-top: 7px;

    padding-top: 5px;

    height: 72px;
}

.qr-info {
    font-size: 11px;

    line-height: 1.5;
}

#qr-canvas {
    width: 65px;
    height: 65px;
}

/* ==============================
   التواقيع
============================== */

.signatures {
    display: flex;

    justify-content: space-around;

    margin-top: 9px;

    text-align: center;

    font-size: 13px;
}

.signature-box {
    width: 35%;
}

.signature-line {
    margin-top: 18px;

    border-bottom: 1px dotted #222;
}

/* ==============================
   الأزرار
============================== */

.buttons {
    text-align: center;

    margin: 15px auto;

    max-width: 1000px;
}

.btn {
    border: none;

    border-radius: 6px;

    padding: 10px 18px;

    margin: 4px;

    cursor: pointer;

    color: white;

    font-family: inherit;

    font-weight: bold;

    font-size: 15px;
}

.btn-send {
    background: #0d6efd;
}

.btn-pdf {
    background: #6f42c1;
}

.btn-print {
    background: #198754;
}

.btn-clear {
    background: #dc3545;
}

.btn:hover {
    opacity: 0.85;
}

.btn:disabled {
    opacity: 0.6;

    cursor: not-allowed;
}

/* ==============================
   رسالة الحالة
============================== */

#statusMessage {
    text-align: center;

    font-size: 15px;

    margin-top: 5px;

    min-height: 22px;
}

/* ==============================
   الهاتف
============================== */

@media (max-width: 800px) {

    body {
        background: white;
    }

    .form-container {
        width: 100%;

        height: auto;

        min-height: 297mm;

        margin: 0;

        padding: 10px;

        box-shadow: none;

        overflow: visible;
    }

    .row {
        flex-direction: row;
    }

    input {
        height: 34px;
    }

    label {
        font-size: 12px;
    }
}

/* ==============================
   الطباعة
============================== */

@media print {

    html,
    body {
        width: 210mm;

        height: 297mm;

        margin: 0;

        padding: 0;

        background: white;
    }

    .form-container {
        width: 210mm;

        height: 297mm;

        min-height: 297mm;

        margin: 0;

        padding: 9mm 10mm;

        box-shadow: none;

        overflow: hidden;
    }

    .buttons,
    #statusMessage {
        display: none !important;
    }

    input,
    textarea {
        border: 1px solid #222;
    }

    @page {
        size: A4 portrait;

        margin: 0;
    }
}

</style>
